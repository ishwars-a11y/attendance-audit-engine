name: Streamlit Keep-Alive

# Pings the dashboard every 4 hours so Streamlit Community Cloud never
# hibernates the app overnight.
# Requires one GitHub secret:  STREAMLIT_URL  (e.g. https://xyz.streamlit.app)

on:
  schedule:
    - cron: "0 1  * * *"   #  6:30 AM IST
    - cron: "0 5  * * *"   # 10:30 AM IST
    - cron: "0 9  * * *"   #  2:30 PM IST
    - cron: "0 13 * * *"   #  6:30 PM IST
    - cron: "0 17 * * *"   # 10:30 PM IST
    - cron: "0 21 * * *"   #  2:30 AM IST (next day)
  workflow_dispatch:        # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit app
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 --retry 2 \
            "${{ secrets.STREAMLIT_URL }}")
          echo "HTTP $STATUS"
          # Streamlit returns 200 when alive; don't fail the job on other codes
          # (the ping itself is enough to trigger a wake-up)
          exit 0
