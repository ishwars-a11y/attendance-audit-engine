name: Daily Attendance Audit

on:
  schedule:
    - cron: "30 4  * * 1-5"  # 10:00 AM IST
    - cron: "30 7  * * 1-5"  #  1:00 PM IST
    - cron: "30 11 * * 1-5"  #  5:00 PM IST
    - cron: "30 15 * * 1-5"  #  9:00 PM IST
    - cron: "30 17 * * 1-5"  # 11:00 PM IST (final)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD). Leave blank to use today.'
        required: false
        default: ''
  push:
    branches: [main]   # keepalive only — see keepalive job below

jobs:

  # ── Engine — runs on schedule and manual dispatch only ─────────────────────
  run-engine:
    runs-on: ubuntu-latest
    if: github.event_name != 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run attendance engine
        env:
          JIBBLE_CLIENT_ID: ${{ secrets.JIBBLE_CLIENT_ID }}
          JIBBLE_CLIENT_SECRET: ${{ secrets.JIBBLE_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python main.py --date "${{ github.event.inputs.date }}"
          else
            python main.py
          fi

  # ── Keepalive — fires on every push to prevent GitHub disabling the schedule ─
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - run: echo "Keepalive ping — no engine run on code push"
