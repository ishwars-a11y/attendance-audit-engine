name: Daily Attendance Audit

on:
  schedule:
    - cron: "30 4  * * 1-5"  # 10:00 AM IST
    - cron: "30 7  * * 1-5"  #  1:00 PM IST
    - cron: "30 11 * * 1-5"  #  5:00 PM IST
    - cron: "30 15 * * 1-5"  #  9:00 PM IST
    - cron: "30 17 * * 1-5"  # 11:00 PM IST (final)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''
      lookback:
        description: 'Re-sync this many working days before the target date (picks up retroactive leave).'
        required: false
        default: '0'
  push:
    branches: [main]

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run attendance engine
        env:
          JIBBLE_CLIENT_ID: ${{ secrets.JIBBLE_CLIENT_ID }}
          JIBBLE_CLIENT_SECRET: ${{ secrets.JIBBLE_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            # Manual dispatch with a specific date
            LOOKBACK="${{ github.event.inputs.lookback }}"
            python main.py --date "${{ github.event.inputs.date }}" --lookback "${LOOKBACK:-0}"

          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled cron: re-sync the past 30 working days (~6 weeks) so any
            # retroactive leave approved in Jibble is picked up automatically.
            # 30 days ensures even late approvals (e.g. leave entered weeks after
            # the fact) are reflected without manual intervention.
            python main.py --lookback 30

          else
            # Push-triggered: same as scheduled — re-sync the past 30 working days
            # so any retroactive leave approved since the last cron is caught immediately.
            python main.py --lookback 30
          fi
