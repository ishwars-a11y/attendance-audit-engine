name: Daily Attendance Audit

on:
  schedule:
    - cron: "30 4  * * 1-5"  # 10:00 AM IST
    - cron: "30 7  * * 1-5"  #  1:00 PM IST
    - cron: "30 11 * * 1-5"  #  5:00 PM IST
    - cron: "30 15 * * 1-5"  #  9:00 PM IST
    - cron: "30 17 * * 1-5"  # 11:00 PM IST (final)
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI
  push:
    branches: [main]   # keep-alive: any push resets GitHub's inactivity timer

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run attendance engine
        env:
          JIBBLE_CLIENT_ID: ${{ secrets.JIBBLE_CLIENT_ID }}
          JIBBLE_CLIENT_SECRET: ${{ secrets.JIBBLE_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python main.py
