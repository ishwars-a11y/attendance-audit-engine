name: Daily Attendance Audit

on:
  schedule:
    - cron: "30 4  * * 1-5"  # 10:00 AM IST
    - cron: "30 7  * * 1-5"  #  1:00 PM IST
    - cron: "30 11 * * 1-5"  #  5:00 PM IST
    - cron: "30 15 * * 1-5"  #  9:00 PM IST
    - cron: "30 17 * * 1-5"  # 11:00 PM IST (final)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''
      lookback:
        description: 'Re-sync this many working days before the target date (picks up retroactive leave).'
        required: false
        default: '0'
  push:
    branches: [main]

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run attendance engine
        env:
          JIBBLE_CLIENT_ID: ${{ secrets.JIBBLE_CLIENT_ID }}
          JIBBLE_CLIENT_SECRET: ${{ secrets.JIBBLE_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            # Manual dispatch with a specific date
            LOOKBACK="${{ github.event.inputs.lookback }}"
            python main.py --date "${{ github.event.inputs.date }}" --lookback "${LOOKBACK:-0}"

          elif [ "${{ github.event.schedule }}" = "30 4 * * 1-5" ]; then
            # First cron of the day (10:00 AM IST): deep re-sync through YESTERDAY
            # to catch retroactive leave applied after the fact (employees often
            # apply on Jibble once they're back). Deliberately does NOT process
            # today — at 10 AM almost nobody has clocked in yet, which used to
            # generate a wave of false Unexcused-Absence flags every morning.
            python main.py --yesterday --lookback 30

          elif [ "${{ github.event.schedule }}" = "30 17 * * 1-5" ]; then
            # Final cron (11:00 PM IST): close out today AND re-heal the last 5
            # working days so same-week retroactive leave applications are
            # reflected the same night instead of waiting for the deep re-sync.
            python main.py --lookback 5

          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Intraday crons (1 PM / 5 PM / 9 PM): sync today only — fast.
            python main.py

          else
            # Push-triggered: do the full 30-day re-sync so a code push also
            # heals any stale leave data immediately.
            python main.py --lookback 30
          fi
